<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<body>

  <header class="topbar">

    </a>
    <nav>
      <a href="/user.html" class="current">Sectors</a>
      <a href="/developer.html">Developer</a>

  <main class="shell">
    <div class="page-head">
      <div>
        <h1>Sectors</h1>

      <div id="sector-rows">
        <div class="state-note"><strong>Loading sectors…</strong> Fetching the latest forecasts.</div>
